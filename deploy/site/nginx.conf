# Flutter Web (path URL strategy): неизвестные пути — index.html, роутинг делает go_router.
server {
    listen 80;
    server_name _;
    root /srv/site/kosma-website;
    index index.html;
    server_tokens off;

    gzip on;
    gzip_types text/css application/javascript application/json application/wasm image/svg+xml;

    # точка входа и service worker — всегда свежие (ревалидация по ETag)
    location = /index.html { add_header Cache-Control "no-cache"; }
    location = /flutter_service_worker.js { add_header Cache-Control "no-cache"; }
    location = /flutter_bootstrap.js { add_header Cache-Control "no-cache"; }
    location = /main.dart.js { add_header Cache-Control "no-cache"; }
    location = /version.json { add_header Cache-Control "no-cache"; }

    # шрифты, картинки, canvaskit — кешировать
    location ~* ^/(assets|canvaskit|icons)/ {
        add_header Cache-Control "public, max-age=604800";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
