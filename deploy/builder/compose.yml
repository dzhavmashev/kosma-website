# Сборщик Flutter Web сайтов на watch-server (стек «flutter-builder», виден в Portainer).
# Только собирает и выкладывает build/web в ~/site/<подкаталог>; ничего не раздаёт
# (сайт раздаёт отдельный стек kosma-site, deploy/site/).
#   docker exec flutter-builder build-site kosma-website kosma-website
#   /src — исходники сайтов (~/src на хосте), /site — выкладка (~/site).
name: flutter-builder

services:
  flutter:
    image: ghcr.io/cirruslabs/flutter:3.44.0
    container_name: flutter-builder
    command: sleep infinity
    working_dir: /src
    environment:
      # файлы сборки и выкладки отдаются пользователю хоста (контейнер работает от root)
      HOST_UID: "1000"
      HOST_GID: "1000"
      PUB_CACHE: /pub-cache
    volumes:
      - /home/user/src:/src
      - /home/user/site:/site
      - /home/user/src/kosma-website/tool/build-site.sh:/usr/local/bin/build-site:ro
      # deploy key (read-only) для git pull внутри контейнера — те же пути, что в core.sshCommand клона
      - /home/user/.ssh/kosma_website_deploy:/home/user/.ssh/kosma_website_deploy:ro
      - /home/user/.ssh/known_hosts:/home/user/.ssh/known_hosts:ro
      - pub_cache:/pub-cache
    restart: unless-stopped

volumes:
  pub_cache:
